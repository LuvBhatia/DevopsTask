services:
  app:
    image: ${APP_IMAGE}
    container_name: task-tracker-prod
    environment:
      APP_ENV: production
    ports:
      - "8080:8000"
    restart: unless-stopped
    networks: [prodnet]

  prometheus:
    image: prom/prometheus:latest
    container_name: task-tracker-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    depends_on: [app, alertmanager]
    restart: unless-stopped
    networks: [prodnet]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: task-tracker-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on: [alert-receiver]
    restart: unless-stopped
    networks: [prodnet]

  alert-receiver:
    image: python:3.13-alpine
    container_name: task-tracker-alert-receiver
    working_dir: /monitoring
    command: ["python", "alert_receiver.py"]
    volumes:
      - ./monitoring:/monitoring
    ports:
      - "9095:9095"
    restart: unless-stopped
    networks: [prodnet]

networks:
  prodnet:
    name: task-tracker-prodnet
